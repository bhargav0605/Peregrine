# CompIDs are from the broker's point of view, so they mirror the client's:
# the client is TRDR and connects to BRKR.

[DEFAULT]
ConnectionType=acceptor
SocketAcceptPort=9876

# 00:00:00 to 00:00:00 means the session never rolls over.
StartTime=00:00:00
EndTime=00:00:00

HeartBtInt=30

# No dictionary yet: routing needs only MsgType, and this avoids vendoring
# FIX44.xml. There is no field-level validation as a result.
UseDataDictionary=N

# Sequence numbers reset on every logon, which keeps restarts simple. The
# sequence-gap scenarios will need the opposite.
ResetOnLogon=Y

[SESSION]
BeginString=FIX.4.4
SenderCompID=BRKR
TargetCompID=TRDR
