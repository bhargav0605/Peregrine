# CompIDs are from our point of view and must mirror broker/broker.cfg exactly.
# Reversed, the broker drops the connection during logon with nothing useful
# printed on this side.
#
#   here (initiator)          broker (acceptor)
#   SenderCompID=TRDR   <-->  TargetCompID=TRDR
#   TargetCompID=BRKR   <-->  SenderCompID=BRKR

[default]
ConnectionType=initiator
SocketConnectHost=127.0.0.1
SocketConnectPort=9876

# Always on, matching the broker. Any other pair schedules a session that logs
# out at a boundary we did not intend.
StartTime=00:00:00
EndTime=00:00:00

# Must match the broker.
HeartBtInt=30

# Must match the broker. It keeps sequence numbers in memory and resets them on
# logon; if this side persisted its own and did not reset, it would reconnect
# expecting a higher number than the broker starts at, and the two would trade
# ResendRequests forever.
ResetOnLogon=Y

# The broker restarting is a lab scenario, not an error.
ReconnectInterval=5

# Matches the broker. Turning this on makes this side the strict one, which is
# a change worth making deliberately rather than by default.
UseDataDictionary=N

[session]
BeginString=FIX.4.4
SenderCompID=TRDR
TargetCompID=BRKR
